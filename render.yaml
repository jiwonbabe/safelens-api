services:
  - type: web
    name: safelens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        value: inworld
      - key: INWORLD_API_KEY
        sync: false
      - key: INWORLD_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODULATE_API_KEY
        sync: false
      - key: KID_API_KEY
        sync: false
      - key: KID_BASE_URL
        value: https://game-api.test.k-id.com/api/v1
